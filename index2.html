<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- Profile Photo Container -->
    <div class="relative w-48 h-48 sm:w-64 sm:h-64 mx-auto">
        <!-- Glow Ring Background -->
        <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-red-600 to-blue-600 blur-md opacity-75"></div>
        
        <!-- Image Element -->
        <img 
            src="your-photo.jpg" 
            alt="David Mendoza Profile Photo" 
            class="relative w-full h-full object-cover rounded-full border-4 border-slate-900 shadow-2xl"
        >
    </div>

</body>
</html>
